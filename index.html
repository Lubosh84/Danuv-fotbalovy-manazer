<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="description" content="Matematický trenažér pro 6.–9. ročník a přípravu na Cermat – s postupem, opakováním chyb a statistikami.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Danův matematický trenažér</title>
<style>
:root{--bg:#0b1b17;--card:#13292a;--card2:#0f2022;--line:#24464a;--tx:#f1f7f5;--mut:#8fb0ab;--pitch:#a3e635;--sky:#38bdf8;--gold:#fbbf24;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg) repeating-linear-gradient(90deg,#0d211c 0 64px,var(--bg) 64px 128px);color:var(--tx);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:680px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px;flex:1}.logo b{color:var(--pitch)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.lvl{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.lvl small{color:var(--mut);font-weight:500}
.bar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--pitch));border-radius:9px;transition:width .5s}
h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:20px 2px 10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;transition:transform .12s,border-color .12s;min-height:92px}
.mode:hover{border-color:var(--pitch);transform:translateY(-2px)}.mode.wide{grid-column:1/-1}.mode.cer{border-color:#a78bfa}
.mode b{display:block;font-size:18px}.mode span{color:var(--mut);font-size:13px}.mode em{float:right;font-style:normal;color:var(--gold);font-size:13px;font-weight:700}
.ghost{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn{padding:14px 22px;border-radius:14px;background:var(--pitch);color:#10230a;font-weight:800;font-size:17px;width:100%}.btn:hover{filter:brightness(1.08)}.btn.sec{background:var(--sky);color:#06222f}
.row{display:flex;gap:10px}.row>*{flex:1}
.prog{display:flex;gap:6px;margin:4px 0 14px;justify-content:center}.prog i{flex:1;max-width:36px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:17px;font-style:normal;background:var(--card2);border:2px solid var(--line)}.prog .cur{border-color:var(--sky);animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 4px #38bdf855}}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:12px;gap:8px}.topic{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.q{font-size:21px;font-weight:700;line-height:1.45;padding:16px;background:var(--card2);border-left:5px solid var(--pitch);border-radius:8px;margin-bottom:14px}
.note{font-size:13px;color:var(--mut);margin-bottom:12px}
input{width:100%;padding:14px;font-size:20px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--tx);margin-bottom:12px;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--sky);outline:none}
.fb{margin-top:14px;padding:16px;border-radius:12px;animation:pop .25s}.fb.ok{background:#0b3a2c;border:1px solid var(--ok)}.fb.no{background:#3d1520;border:1px solid var(--bad)}
.fb b{font-size:18px;display:block;margin-bottom:6px}.fb p{color:#dbe9e6}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.big{font-size:56px;text-align:center;letter-spacing:6px}.center{text-align:center}.sum{font-size:18px;margin:10px 0}.gold{color:var(--gold);font-weight:700}
.t{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin:7px 0}.t .bar i{background:var(--pitch)}.t .bar.w i{background:var(--bad)}
.h{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}.h span:last-child{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--pitch);padding:10px 18px;border-radius:12px;z-index:9}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{background:linear-gradient(#0a1512,#122a24);border:2px solid var(--line);border-radius:18px;padding:18px 16px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:8px;border:2px solid #ffffff1c;border-radius:10px}.hero:after{content:"";position:absolute;left:50%;top:8px;bottom:8px;border-left:2px solid #ffffff1c}
.hero>*{position:relative;z-index:1}.sb{display:flex;justify-content:center;align-items:flex-start;gap:22px;font:800 46px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--gold);text-shadow:0 0 14px #fbbf2466}
.sb div{min-width:110px;text-align:center}.sb small{font:700 11px system-ui;color:var(--mut);letter-spacing:2px;display:block;margin-top:8px;text-shadow:none}
.mode{position:relative;overflow:hidden;border-left:6px solid var(--pitch)}.mode.cer{border-left-color:#a78bfa}.mode.top{border-left-color:var(--sky)}.mode.red{border-left-color:var(--bad)}
.mode .no{position:absolute;right:10px;bottom:-8px;font:900 64px/1 Impact,'Arial Black',system-ui;font-style:normal;color:transparent;-webkit-text-stroke:2px #ffffff22;pointer-events:none}
#game .panel{background:var(--card) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><g fill='none' stroke='white' stroke-opacity='.07' stroke-width='3'><rect x='50' y='-3' width='200' height='110'/><rect x='105' y='-3' width='90' height='44'/><path d='M115 107a40 40 0 0 0 70 0'/></g></svg>") no-repeat top center/100%}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bd{padding:10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px}.bd.off{opacity:.35;filter:grayscale(1)}.bd b{display:block;font-size:14px}
.rep p{margin:6px 0}.rep{font-size:15px}
#sheet{display:none}
@media print{body{background:#fff!important;color:#111}#app>*:not(#sheet){display:none!important}#sheet{display:block;font-family:Georgia,serif;border:6px double #166534;padding:28px;color:#111}#sheet h1{text-align:center;color:#166534}#sheet table{width:100%;border-collapse:collapse;margin-top:12px}#sheet td{border-bottom:1px solid #ccc;padding:4px}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="logo">⚽ Danův <b>trenažér</b></div><span class="chip" id="streak"></span><button class="chip" id="snd" aria-label="Zvuk"></button></div>
<section id="home"></section>
<section id="game" hidden>
<div class="row" style="margin-bottom:10px"><button class="ghost" id="quit" style="flex:0">← Domů</button><span class="chip" style="text-align:center" id="clock">0:00</span><span class="chip" style="text-align:center" id="combo"></span></div>
<div class="prog" id="prog"></div>
<div class="panel">
<div class="meta"><span id="mode"></span><span class="topic" id="topic"></span></div>
<div class="q" id="q"></div>
<p class="note">✏️ Počítej na papír, do políčka napiš jen výsledek. Zlomky jako 3/4, desetinná čísla s čárkou.</p>
<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tvůj výsledek…" aria-label="Odpověď">
<div class="row" id="act"><button class="ghost" id="skip">Nevím</button><button class="btn" id="go">Vystřelit! ⚽</button></div>
<div id="fb" hidden></div>
<button class="btn sec" id="next" style="margin-top:14px" hidden>Další akce ➔</button>
</div>
</section>
<section id="result" hidden></section>
<section id="stats" hidden></section>
<section id="topics" hidden></section>
<div id="sheet"></div>
</div>
<script>
const database = {
'6':[
{topic:"Záporná čísla",q:"Vypočítej: -15 + 8 - (-4)",a:"-3",exp:"Mínus před závorkou mění znaménko: -(-4) = +4. Tedy -15 + 8 + 4 = -3."},
{topic:"Zlomky",q:"Zkrať zlomek 45/60 na základní tvar (piš jako a/b)",a:"3/4",exp:"Obě čísla vydělíme 15: 45 : 15 = 3 a 60 : 15 = 4."},
{topic:"Slovní úloha",q:"Autobus ujel 180 km za 3 hodiny. Jakou jel průměrnou rychlostí v km/h?",a:"60",exp:"Rychlost v = s / t, tedy 180 : 3 = 60 km/h."},

{topic:"Desetinná čísla",q:"Vypočítej: -4,5 - (-2,1)",a:"-2,4",exp:"-4,5 − (−2,1) = −4,5 + 2,1 = −2,4."},
{topic:"Procenta",q:"30 % z nějakého čísla je 45. Jaké je to číslo?",a:"150",exp:"1 % = 45 : 30 = 1,5. Celých 100 % je 1,5 · 100 = 150."},

{topic:"Mnohočleny",q:"Vypočítej: (x + 4)(x - 2) (zapiš jako x^2+2x-8)",a:"x^2+2x-8",exp:"x·x − 2x + 4x − 8 = x² + 2x − 8."},
{topic:"Objem a jednotky",q:"Kolik je 0,5 m³ v litrech?",a:"500",exp:"1 m³ = 1 000 litrů, takže 0,5 m³ = 500 litrů."},

{topic:"Statistika",q:"Dan měl v 5 testech známky: 1, 3, 2, 4, 5. Jaký je jeho průměr?",a:"3",exp:"Součet známek je 15. Průměr: 15 : 5 = 3."},

{topic:"Goniometrie",q:"V pravoúhlém trojúhelníku je protilehlá odvěsna 3 a přepona 5. Kolik je sin(α)? (zapiš zlomkem)",a:"3/5",exp:"Sinus je poměr protilehlé odvěsny a přepony: sin(α) = 3/5 = 0,6."},

{topic:"Objem těles",q:"Jaký je objem krychle o hraně a = 3 cm v cm³?",a:"27",exp:"V = a³ = 3 · 3 · 3 = 27 cm³."},

{topic:"Lineární funkce",q:"Urči y-ovou souřadnici průsečíku přímky y = 2x - 6 s osou y.",a:"-6",exp:"Na ose y je x = 0. Dosadíme: y = 2 · 0 − 6 = −6."},

{topic:"Cermat – Lomené výrazy",q:"Výraz (x² - 4) / (x - 2) zkrať. Jaká hodnota vyjde pro x = 5?",a:"7",exp:"x² − 4 = (x − 2)(x + 2). Po zkrácení zůstane x + 2; pro x = 5 vyjde 7. Podmínka: x ≠ 2."},

const $=id=>document.getElementById(id),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)],gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

const g8=[()=>{const a=r(2,9),x=pick([-9,-7,-5,-3,-2,2,3,4,6,8]),b=r(1,20),c=a*x+b;return{topic:'Lineární rovnice',q:`Vyřeš rovnici: ${a}x + ${b} = ${c}`,a:String(x),exp:`${a}x = ${c} − ${b} = ${c-b}, tedy x = ${c-b} : ${a} = ${x}.`}},
()=>{const T=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=r(1,3),[a,b,c]=T.map(v=>v*k);return{topic:'Pythagorova věta',q:`Odvěsny pravoúhlého trojúhelníku jsou ${a} cm a ${b} cm. Jaká je přepona v cm?`,a:String(c),exp:`c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}, proto c = ${c} cm.`}},
()=>{const R=r(2,12),v=314*R*R/100;return{topic:'Obsah kruhu',q:`Obsah kruhu s poloměrem ${R} cm (π = 3,14) v cm²:`,a:String(v),exp:`S = π · r² = 3,14 · ${R}² = 3,14 · ${R*R} = ${String(v).replace('.',',')} cm².`}}];
const g9=[()=>{const a=r(2,5),b=r(2,3),c=pick([16,25,36,49,64,81,100,121,144]),v=a**b+Math.sqrt(c);return{topic:'Mocniny a odmocniny',q:`Vypočítej: ${a}${sup[b]} + √${c}`,a:String(v),exp:`${a}${sup[b]} = ${a**b}, √${c} = ${Math.sqrt(c)}. Součet je ${v}.`}},
()=>{let p,q;do{p=r(-6,3);q=p+r(1,6)}while(!p||!q||p+q===0);const B=-(p+q),C=p*q;return{topic:'Kvadratické rovnice',q:`Napiš menší kořen rovnice x² ${sg(B)}x ${sg(C)} = 0`,a:String(p),exp:`Rozklad: (x ${sg(-p)})(x ${sg(-q)}) = 0. Kořeny jsou ${p} a ${q}, menší je ${p}.`}},
()=>{const a=r(2,9),b=r(2,9),c=r(2,9);return{topic:'Objem těles',q:`Kvádr má hrany ${a} cm, ${b} cm a ${c} cm. Jaký je objem v cm³?`,a:String(a*b*c),exp:`V = a · b · c = ${a} · ${b} · ${c} = ${a*b*c} cm³.`}}];
const gC=[()=>{const v=r(3,10)*10,t=pick([1.5,2.5,3.5]),d=v*t;return{topic:'Rychlost',q:`Vlak ujel ${d} km za ${String(t).replace('.',',')} h. Jaká byla průměrná rychlost v km/h?`,a:String(v),exp:`v = s : t = ${d} : ${t} = ${v} km/h.`}},g7[0],g8[0],g9[1]];
const G={'6':[()=>{const x=r(5,30),y=r(5,30),z=r(2,15),v=-x+y+z;return{topic:'Záporná čísla',q:`Vypočítej: -${x} + ${y} - (-${z})`,a:String(v),exp:`-(-${z}) = +${z}. Tedy -${x} + ${y} + ${z} = ${v}.`}},
()=>{const k=r(2,9),d=r(1,9),v=k*1000+d*100;return{topic:'Převody jednotek',q:`Převeď na metry: ${k},${d} km = ? m`,a:String(v),exp:`1 km = 1 000 m, takže ${k},${d} · 1 000 = ${v} m.`}},
()=>{const a=r(10,90),b=r(2,9),c=r(2,9);return{topic:'Pořadí operací',q:`Vypočítej: ${a} + ${b} · ${c}`,a:String(a+b*c),exp:`Nejdříve násobení: ${b} · ${c} = ${b*c}. Pak ${a} + ${b*c} = ${a+b*c}.`}}],'7':g7,'8':g8,'9':g9,cermat:gC.map(f=>()=>{const x=f();x.topic='Cermat – '+x.topic;return x})};
const MODES=[['6','6. ročník','Základy a záporná čísla'],['7','7. ročník','Zlomky, procenta, poměr'],['8','8. ročník','Rovnice, Pythagoras'],['9','9. ročník','Kvadratické rovnice, goniometrie'],['cermat','🎯 Cermat zápas','Příprava na přijímačky']];
const modeName=m=>m==='chyby'?'Opravna chyb':m.startsWith('t:')?'🎯 '+m.slice(2):(MODES.find(x=>x[0]===m)||[])[1];
// ---- Kontrola odpovědi ----
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/[·*]/g,'').replace(/π/g,'pi');
function same(u,c){u=norm(u);c=norm(c);if(u===c)return true;
 const N=/^[-+]?\d+(\.\d+)?$/;if(N.test(u)&&N.test(c))return Number(u)===Number(c);
 const F=/^(-?\d+)\/(\d+)$/,fu=u.match(F),fc=c.match(F);
 if(fu&&fc&&+fu[2]&&gcd(+fu[1],+fu[2])===1)return fu[1]*fc[2]===fc[1]*fu[2];return false}
// ---- Hráč, úroveň, série ----
const lvl=()=>Math.floor(Math.sqrt(S.xp/40))+1;
function head(){$('streak').textContent='🔥 '+S.streak+' '+(S.streak==1?'den':S.streak>1&&S.streak<5?'dny':'dní');$('snd').textContent=S.sound?'🔊':'🔇'}
function beep(f,d=.12){if(!S.sound)return;try{const c=beep.c=beep.c||new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function show(id){['home','game','result','stats','topics'].forEach(s=>$(s).hidden=s!==id);clearInterval(M.timer);if(id==='game')M.timer=setInterval(tick,1000);scrollTo(0,0)}
// ---- Domů ----
const tot=()=>{const V=Object.values(S.topics);return{g:V.reduce((a,v)=>a+v.c,0),ms:V.reduce((a,v)=>a+v.t-v.c,0)}};
function home(){const L=lvl(),lo=40*(L-1)**2,hi=40*L*L,wr=Object.keys(S.wrong).length,{g,ms}=tot();head();
 $('home').innerHTML=`<div class="hero"><div class="sb"><div>${g}<small>DAN</small></div><span>:</span><div>${ms}<small>MATEMATIKA</small></div></div><div class="lvl" style="margin:16px 0 8px"><span>Úroveň ${L} · ${TITLES[Math.min(L-1,5)]}</span><small>${S.xp} XP</small></div><div class="bar"><i style="width:${Math.round((S.xp-lo)/(hi-lo)*100)}%"></i></div></div>
<h2>Vyber zápas</h2><div class="modes">${MODES.map(m=>`<button class="mode${m[0]==='cermat'?' cer wide':''}" data-m="${m[0]}"><i class="no">${m[0]==='cermat'?'🏆':m[0]}</i><em>${S.best[m[0]]!=null?'★ '+S.best[m[0]]+' %':''}</em><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}
<button class="mode top wide" id="tp"><i class="no">🎯</i><b>Trénink podle tématu</b><span>Vyber si slabé místo a procvičuj jen to</span></button>
<button class="mode red wide" data-m="chyby"><i class="no">🟨</i><em>${wr}</em><b>Opravna chyb</b><span>${wr?'Příklady, které se nepovedly – zkus je znovu':'Zatím žádné chyby – skvělé!'}</span></button></div>
<h2>Přehled</h2><button class="ghost" style="width:100%" id="st">📊 Statistiky, trofeje a přehled pro rodiče</button>`;
 $('home').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));$('st').onclick=stats;$('tp').onclick=topicsView;show('home')}
let TM;
function topicMap(){const m={},add=(t,k,o)=>{t=t.replace('Cermat – ','');(m[t]=m[t]||{s:[],g:[]})[k].push(o)};
 for(const k in database)database[k].forEach(x=>add(x.topic,'s',x));
 ['6','7','8','9'].forEach(k=>G[k].forEach(f=>add(f().topic,'g',f)));return m}
function topicsView(){TM=TM||topicMap();
 const L=Object.keys(TM).map(t=>{const v=S.topics[t];return[t,v?Math.round(v.c/v.t*100):null]}).sort((a,b)=>(a[1]??-1)-(b[1]??-1));
 $('topics').innerHTML=`<button class="ghost" id="b">← Domů</button><h2>Vyber téma (nejslabší nahoře)</h2><div class="modes">${L.map(t=>`<button class="mode top" data-t="${t[0]}"><b style="font-size:16px">${t[0]}</b><span>${t[1]==null?'ještě nehráno':t[1]+' % úspěšnost'}</span></button>`).join('')}</div>`;
 $('b').onclick=home;$('topics').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>start('t:'+b.dataset.t));show('topics')}
// ---- Zápas ----
let M={};
function build(mode){let L;
 if(mode==='chyby')L=Object.values(S.wrong);
 else if(mode.startsWith('t:')){const t=TM[mode.slice(2)];L=t.s.slice();for(let i=0;i<10&&t.g.length;i++){const g=t.g[i%t.g.length]();if(!L.some(x=>x.q===g.q))L.push(g)}}
 else{L=(database[mode]||[]).slice();for(let i=0;i<8;i++){const g=G[mode][i%G[mode].length]();if(!L.some(x=>x.q===g.q))L.push(g)}}
 const w=x=>{const b=S.box[x.q];return b===undefined?1:b===0?3:b===1?1.5:.4};
 return L.map(x=>[Math.random()**(1/w(x)),x]).sort((a,b)=>b[0]-a[0]).slice(0,10).map(p=>p[1])}
function start(mode){const list=build(mode);if(!list.length){toast('Žádné chyby k opravě 👍');return}
 M={mode,list,i:0,c:0,combo:0,max:0,xp:0,res:[],t0:Date.now()};
 $('mode').textContent=modeName(mode);show('game');load()}
function tick(){const s=Math.floor((Date.now()-M.t0)/1000);$('clock').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function prog(){$('prog').innerHTML=M.list.map((_,i)=>`<i class="${i===M.i&&i>=M.res.length?'cur':''}">${i<M.res.length?(M.res[i]?'⚽':'🟨'):''}</i>`).join('')}
function load(){const q=M.list[M.i];prog();tick();$('combo').textContent=M.combo>1?'🔥 série '+M.combo:'Otázka '+(M.i+1)+'/'+M.list.length;
 $('topic').textContent=q.topic;$('q').textContent=q.q;$('ans').value='';$('ans').disabled=false;$('fb').hidden=true;$('next').hidden=true;$('act').hidden=false;$('ans').focus()}
function answer(skip){const q=M.list[M.i],v=$('ans').value;if(!skip&&!v.trim())return $('ans').focus();
 const ok=!skip&&same(v,q.a);$('ans').disabled=true;$('act').hidden=true;M.res.push(ok);
 const t=q.topic.replace('Cermat – ',''),T=S.topics[t]=S.topics[t]||{c:0,t:0};T.t++;
 if(ok){M.c++;M.combo++;M.max=Math.max(M.max,M.combo);S.mc=Math.max(S.mc||0,M.combo);if(M.combo===3)toast('🎩 HAT-TRICK!');if(M.combo===5)toast('🖐 Pětka v řadě!');const x=10+Math.min(M.combo-1,5)*2;M.xp+=x;T.c++;S.box[q.q]=Math.min((S.box[q.q]||0)+1,5);delete S.wrong[q.q];beep(660);beep(880,.15)}
 else{M.combo=0;S.box[q.q]=0;S.wrong[q.q]={topic:q.topic,q:q.q,a:q.a,exp:q.exp};const k=Object.keys(S.wrong);if(k.length>40)delete S.wrong[k[0]];beep(200,.25)}
 $('fb').hidden=false;$('fb').className='fb '+(ok?'ok':'no');
 $('fb').innerHTML=`<b>${ok?'⚽ GÓÓÓL! +'+(10+Math.min(M.combo-1,5)*2)+' XP':'🟨 Žlutá karta – mimo branku. Správně: '+q.a}</b><p>${q.exp}</p>`;
 $('next').hidden=false;$('next').textContent=M.i===M.list.length-1?'Vyhodnotit zápas 🏆':'Další akce ➔';$('next').focus();prog();save()}
function next(){if(++M.i>=M.list.length)return end();load()}
function end(){const n=M.list.length,pct=Math.round(M.c/n*100),sec=Math.floor((Date.now()-M.t0)/1000),before=lvl();
 const today=new Date().toLocaleDateString('sv'),y=new Date(Date.now()-864e5).toLocaleDateString('sv');
 if(S.last!==today){S.streak=S.last===y?S.streak+1:1;S.last=today}
 if(pct>=80)M.xp+=20;if(M.c===n&&n>=10)S.pf=(S.pf||0)+1;S.xp+=M.xp;
 if(MODES.some(x=>x[0]===M.mode)&&(S.best[M.mode]==null||pct>S.best[M.mode]))S.best[M.mode]=pct;
 S.hist.unshift({d:today,m:M.mode,c:M.c,n,s:sec});S.hist=S.hist.slice(0,30);save();head();
 const st=pct>=90?3:pct>=70?2:pct>=40?1:0,L=lvl();
 $('result').innerHTML=`<div class="panel center"><div class="big">${'⭐'.repeat(st)||'🧤'}</div><h1 style="margin:8px 0">Konec zápasu!</h1>
<p class="sum">Dan vstřelil <b>${M.c}</b> gólů z ${n} · ${pct} % · ⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</p>
<p class="gold">${pct===100?'🏆 Dokonalý zápas!':pct>=80?'Skvělý výkon, Dan je ve formě!':pct>=60?'Dobrý zápas, ještě kousek!':pct>=40?'Každý trénink tě posune dál. Zkus odvetu!':'Každý šampion trénuje – zkus odvetu!'}</p>
<p class="sum">+${M.xp} XP · nejdelší série ${M.max}${L>before?`<br><span class="gold">⬆ Nová úroveň ${L}: ${TITLES[Math.min(L-1,5)]}!</span>`:''}</p>
<div class="row" style="margin-top:16px"><button class="ghost" id="h">Domů</button><button class="btn" id="again">Odveta ⚽</button></div></div>`;
 $('h').onclick=home;$('again').onclick=()=>start(M.mode);show('result');if(pct>=70){beep(523);setTimeout(()=>beep(659),120);setTimeout(()=>beep(784,.25),240)}}
// ---- Statistiky ----
function report(){const w=Date.now()-7*864e5,H=S.hist.filter(x=>new Date(x.d)>=w),n=H.reduce((a,x)=>a+x.n,0),c=H.reduce((a,x)=>a+x.c,0),s=H.reduce((a,x)=>a+x.s,0);
 const T=Object.entries(S.topics).filter(x=>x[1].t>=3).map(([k,v])=>[k,Math.round(v.c/v.t*100)]).sort((a,b)=>a[1]-b[1]),f=a=>a.map(x=>x[0]+' ('+x[1]+' %)').join(', ');
 return `<p><b>Posledních 7 dní:</b> ${H.length} zápasů, úspěšnost ${n?Math.round(c/n*100):0} %, ${Math.round(s/60)} min tréninku. Denní série: ${S.streak}.</p><p><b>Doporučeno procvičit:</b> ${f(T.filter(x=>x[1]<70).slice(0,3))||'zatím nic zásadního'}.</p><p><b>Silné stránky:</b> ${f(T.filter(x=>x[1]>=80).slice(-3).reverse())||'zatím málo dat'}.</p>`}
function stats(){const T=Object.entries(S.topics).map(([k,v])=>[k,Math.round(v.c/v.t*100)]).sort((a,b)=>a[1]-b[1]),{g}=tot();
 const B=[['🎩','Hattrick','3 správně za sebou',(S.mc||0)>=3],['🖐','Pětka','5 správně za sebou',(S.mc||0)>=5],['🧤','Čisté konto','10 z 10 v zápase',(S.pf||0)>=1],['📅','Týden v kuse','7 dní trénink',S.streak>=7],['⚽','Stovka gólů','100 správných',g>=100],['🏆','Cermat 80 %','zápas na 80 %+',(S.best.cermat||0)>=80],['🎯','Všestranný','zahraj všech 5 zápasů',MODES.every(m=>S.best[m[0]]!=null)]];
 $('stats').innerHTML=`<button class="ghost" id="b">← Domů</button><h2>Trofeje</h2><div class="badges">${B.map(x=>`<div class="bd${x[3]?'':' off'}">${x[0]} <b>${x[1]}</b>${x[2]}</div>`).join('')}</div>
<h2>Přehled pro rodiče</h2><div class="panel rep">${report()}<button class="ghost" id="pr" style="width:100%;margin-top:8px">🖨 Vytisknout / uložit jako PDF</button></div>
<h2>Témata (nejslabší nahoře)</h2><div class="panel">${T.length?T.map(t=>`<div class="t"><span>${t[0]}</span><div class="bar ${t[1]<60?'w':''}"><i style="width:${t[1]}%"></i></div><b>${t[1]} %</b></div>`).join(''):'<span class="note">Odehraj první zápas a tady se objeví výsledky.</span>'}</div>
<h2>Poslední zápasy</h2><div class="panel">${S.hist.slice(0,10).map(x=>`<div class="h"><span>${modeName(x.m)} – ${x.c}/${x.n}</span><span>${x.d.slice(8)}. ${x.d.slice(5,7)}.</span></div>`).join('')||'<span class="note">Zatím nic.</span>'}</div>
<button class="ghost" id="rs" style="width:100%;margin-top:6px;color:var(--bad)">Smazat veškerý postup</button>`;
 $('b').onclick=home;$('pr').onclick=()=>{const L=lvl();$('sheet').innerHTML=`<h1>⚽ Zápisek z trenérské lavičky</h1><p style="text-align:center;font-size:20px">Dan · úroveň ${L} – ${TITLES[Math.min(L-1,5)]}</p><p style="text-align:center">Celkem ${g} gólů z ${g+tot().ms} pokusů · ${new Date().toLocaleDateString('cs-CZ')}</p>${report()}<table>${T.map(t=>`<tr><td>${t[0]}</td><td align="right">${t[1]} %</td></tr>`).join('')}</table>`;print()};
 $('rs').onclick=()=>{if(confirm('Opravdu smazat XP, statistiky i chyby?')){localStorage.removeItem(LS);location.reload()}};show('stats')}
// ---- Ovládání ----
$('go').onclick=()=>answer();$('skip').onclick=()=>answer(true);$('next').onclick=next;$('quit').onclick=()=>{if(confirm('Opustit zápas? Průběh se nepočítá.'))home()};
$('snd').onclick=()=>{S.sound=S.sound?0:1;save();head()};
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('ans').disabled)answer()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('next').hidden&&!$('game').hidden)next()});
home();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
